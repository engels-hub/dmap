[package]
name = "dmap"
description = "Map display for a tabletop RPG table with a TV"
readme = "../../README.md"
keywords = ["dnd", "tabletop", "map", "vtt"]
categories = ["games", "graphics"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
egui = "0.36"
# wgpu comes through this re-export so its version always matches egui's.
egui-wgpu = { version = "0.36", features = ["winit"] }
# winit comes through this re-export so its version always matches egui's.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui-winit = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
hotpath = "0.25"
pollster = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc", "hotpath"]

[lints]
workspace = true
